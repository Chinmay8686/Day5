<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouTube Grid with Channel Tooltips</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Roboto, Arial, sans-serif;
    }

    body {
      padding: 20px;
      background-color: #f9f9f9;
    }

    /* ================================
       Grid Layout
       ================================ */

    .video-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      column-gap: 16px;
      row-gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 600px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .video-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }


    /* ================================
       Video Card
       ================================ */

    .video-preview {
      display: flex;
      flex-direction: column;
    }

    .thumbnail-row {
      position: relative;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      border-radius: 12px;
      background-color: #ccc;
    }

    .video-time {
      position: absolute;
      bottom: 8px;
      right: 8px;

      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;

      font-size: 12px;
      font-weight: 500;

      padding: 3px 5px;
      border-radius: 4px;
    }


    /* ================================
       Video Information
       ================================ */

    .video-info-grid {
      display: grid;
      grid-template-columns: 36px 1fr;
      column-gap: 12px;
    }

    .profile-picture {
      width: 36px;
      height: 36px;

      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;

      color: #0f0f0f;

      margin-bottom: 6px;

      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-author,
    .video-stats {
      font-size: 12px;
      color: #606060;
    }


    /* ================================
       Channel Tooltip
       ================================ */

    .profile-picture-container {
      position: relative;
      display: inline-block;
    }

    .channel-tooltip {
      position: absolute;

      bottom: -90px;
      left: 0;

      display: flex;
      align-items: center;

      gap: 12px;

      background-color: #ffffff;

      padding: 12px 16px;

      border-radius: 8px;

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);

      width: max-content;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.15s ease-in-out;

      z-index: 100;
    }

    .profile-picture-container:hover .channel-tooltip {
      opacity: 1;
      pointer-events: auto;
    }

    .channel-tooltip-picture {
      width: 50px;
      height: 50px;

      border-radius: 50%;
      object-fit: cover;
    }

    .channel-tooltip-name {
      font-weight: bold;
      font-size: 16px;

      color: #0f0f0f;

      margin-bottom: 4px;
    }

    .channel-tooltip-stats {
      font-size: 14px;
      color: #606060;
    }


    /* ================================
       Exercise 17a
       Screen wider than 1000px
       ================================ */

    @media (min-width: 1000px) {

      /* Video titles */
      .video-title {
        font-size: 16px;
        line-height: 24px;
      }

      /* Other text */
      .video-author,
      .video-stats {
        font-size: 14px;
      }

    }

  </style>
</head>


<body>

  <div class="video-grid">


    <!-- =========================
         Video 1
         ========================= -->

    <div class="video-preview">

      <div class="thumbnail-row">

        <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
           target="_blank">

          <img
            class="thumbnail"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVMFVoU_mBgKunPJjlcY1VW7OKllGttmJliPIY3eZJxw&s=10"
          >

        </a>

        <div class="video-time">
          14:20
        </div>

      </div>


      <div class="video-info-grid">

        <div class="channel-picture">

          <div class="profile-picture-container">

            <a href="https://youtube.com/c/mkbhd"
               target="_blank">

              <img
                class="profile-picture"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7d_Ttoznhe5aCe0iK_WPX8Vr7HLy30fFoiSUf2K0aWg&s=10g"
              >

            </a>


            <!-- Tooltip -->

            <div class="channel-tooltip">

              <img
                class="channel-tooltip-picture"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7d_Ttoznhe5aCe0iK_WPX8Vr7HLy30fFoiSUf2K0aWg&s=10g"
              >

              <div>

                <div class="channel-tooltip-name">
                  Marques Brownlee
                </div>

                <div class="channel-tooltip-stats">
                  15M subscribers
                </div>

              </div>

            </div>

          </div>

        </div>


        <div class="video-info">

          <a
            href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
            target="_blank"
            class="video-title-link"
          >

            <p class="video-title">
              Talking Tech and AI with Google CEO Sundar Pichai!
            </p>

          </a>

          <p class="video-author">
            Marques Brownlee
          </p>

          <p class="video-stats">
            3.4M views &#183; 6 months ago
          </p>

        </div>

      </div>

    </div>



    <!-- =========================
         Video 2
         ========================= -->

    <div class="video-preview">

      <div class="thumbnail-row">

        <a
          href="https://www.youtube.com/watch?v=mP0RAo9SKZk"
          target="_blank"
        >

          <img
            class="thumbnail"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOoQ_FS96zX39A4CMHykkSPn-S-gzrMJbYwjidXvT6HA&s=10"
          >

        </a>

        <div class="video-time">
          8:22
        </div>

      </div>


      <div class="video-info-grid">

        <div class="channel-picture">

          <div class="profile-picture-container">

            <a
              href="https://youtube.com/c/markiplier"
              target="_blank"
            >

              <img
                class="profile-picture"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB33tp_ARcAxui-c5L3fcf_x0NFmwt1Uq0bsAlQWzJog&s=10"
              >

            </a>


            <!-- Tooltip -->

            <div class="channel-tooltip">

              <img
                class="channel-tooltip-picture"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB33tp_ARcAxui-c5L3fcf_x0NFmwt1Uq0bsAlQWzJog&s=10"
              >

              <div>

                <div class="channel-tooltip-name">
                  Markiplier
                </div>

                <div class="channel-tooltip-stats">
                  30M subscribers
                </div>

              </div>

            </div>

          </div>

        </div>


        <div class="video-info">

          <a
            href="https://www.youtube.com/watch?v=mP0RAo9SKZk"
            target="_blank"
            class="video-title-link"
          >

            <p class="video-title">
              Try Not To Laugh Challenge #9
            </p>

          </a>

          <p class="video-author">
            Markiplier
          </p>

          <p class="video-stats">
            19M views &#183; 4 years ago
          </p>

        </div>

      </div>

    </div>


  </div>

</body>
</html>
